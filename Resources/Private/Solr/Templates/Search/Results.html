<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
    xmlns:s="http://typo3.org/ns/ApacheSolrForTypo3/Solr/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Split"/>

<f:section name="content">
    <div id="tx-solr-search" class="d-solr-search d-solr-search--skills" data-shadcn-pattern="search-results">
        <!--
            No heading here on purpose. This template is registered at
            templateRootPaths.200 and so outranks Desiderio's on every site that
            resolves the skillflow-solr set, not only the skills search - including
            sites that reach it through site-package-search's optional dependency.
            The hardcoded "Skills" that used to sit here therefore gave the MTUG
            camp site a second top-level heading, in English, on its German,
            Chinese and Hungarian search pages. The page title supplies the
            heading, and the results region below has its own screen-reader one.
        -->

        <f:render partial="Debug/Query" section="Query" arguments="{resultSet: resultSet}" />

        <div class="d-solr-search__command-row">
            <div class="d-solr-search__command">
                <f:render partial="Search/Form" section="Form" arguments="{search: search, additionalFilters: additionalFilters, pluginNamespace: pluginNamespace, resultSet: resultSet}" />
            </div>

            <f:if condition="{resultSet.hasSearched} && {resultSet.usedSearchRequest.contextTypoScriptConfiguration.searchSorting}">
                <div class="d-solr-search__sort">
                    <f:render partial="Result/Sorting" section="Sorting" arguments="{resultSet: resultSet}" />
                </div>
            </f:if>
        </div>

        <f:if condition="{resultSet.facets.used -> f:count()}">
            <f:render partial="Result/FacetsActive" section="FacetsActive" arguments="{resultSet: resultSet}" />
        </f:if>

        <s:debug.query>
            <div class="d-solr-status-card" role="status" data-slot="card">
                <strong class="block font-semibold">Parsed Query:</strong>
                <span class="text-muted-foreground">{parsedQuery}</span>
            </div>
        </s:debug.query>

        <f:if condition="{resultSet.hasSearched}">
            <div class="d-solr-search__meta">
                <f:if condition="{resultSet.isAutoCorrected}">
                    <f:then>
                        <p>
                            <f:translate key="no_results_nothing_found" extensionName="solr" arguments="{0: resultSet.initialQueryString}" />
                            <f:translate key="no_results_showing_results_suggestion" extensionName="solr" arguments="{0: resultSet.correctedQueryString}" />
                        </p>
                    </f:then>
                    <f:else>
                        <f:if condition="{resultSet.usedQuery.rawSearchTerm}">
                            <p>
                                <f:translate key="results_searched_for" extensionName="solr" arguments="{0: resultSet.usedQuery.rawSearchTerm}" />
                            </p>
                        </f:if>
                    </f:else>
                </f:if>

                <f:if condition="{resultSet.hasSpellCheckingSuggestions}">
                    <p>
                        <f:translate key="didYouMean" extensionName="solr" />
                        <f:for each="{resultSet.spellCheckingSuggestions}" as="suggestion">
                            <f:link.page additionalParams="{q: suggestion.fullQuery}" class="font-medium text-primary underline underline-offset-4">{suggestion.fullQuery}</f:link.page>
                        </f:for>?
                    </p>
                </f:if>

                <f:if condition="!{resultSet.allResultCount} && !{resultSet.isAutoCorrected}">
                    <div class="d-solr-status-card d-solr-no-results" role="status" data-slot="card">
                        <strong class="block font-semibold">
                            <f:translate key="no_results_nothing_found" extensionName="solr" arguments="{0: resultSet.usedQuery.rawSearchTerm}" />
                        </strong>
                        <span class="text-muted-foreground">Try a different or more general search term.</span>
                    </div>
                </f:if>

                <f:if condition="{resultSet.allResultCount}">
                    <p>
                        <f:if condition="{resultSet.allResultCount} == 1">
                            <f:then><f:translate key="results_found.singular" extensionName="solr" arguments="{0: resultSet.usedSearch.queryTime}" /></f:then>
                            <f:else><f:translate key="results_found" extensionName="solr" arguments="{0: resultSet.allResultCount, 1: resultSet.usedSearch.queryTime}" /></f:else>
                        </f:if>
                        <f:if condition="{pagination.lastPageNumber} > 1">
                            <s:pageBrowserRange>
                                <f:translate key="results_range" extensionName="solr" arguments="{0: from, 1: to, 2: total}" />
                            </s:pageBrowserRange>
                        </f:if>
                    </p>
                </f:if>
            </div>
            <f:if condition="{resultSet.searchresults.hasGroups}">
                <f:then>
                    <div class="d-solr-results-group-list">
                        <f:for each="{resultSet.searchresults.groups}" as="group">
                            <section class="d-solr-results-group">
                                <h2 class="d-solr-results-group__title">{group.groupname}</h2>
                                <f:for each="{group.groupitems}" as="groupItem">
                                    <div class="d-solr-results-group__items">
                                        <p class="d-solr-results-group__label">{groupItem.groupValue} <span>({groupItem.allResultCount})</span></p>
                                        <s:groupItemPaginate groupItem="{groupItem}" resultSet="{resultSet}">
                                            <ol start="{pagination.resultCountStart}" class="d-solr-results-list">
                                                <f:for each="{documents}" as="document">
                                                    <li>
                                                        <f:render partial="Result/Document" section="Document" arguments="{resultSet: resultSet, document: document}" />
                                                    </li>
                                                </f:for>
                                            </ol>
                                        </s:groupItemPaginate>
                                    </div>
                                </f:for>
                            </section>
                        </f:for>
                    </div>
                </f:then>
                <f:else if="{resultSet.allResultCount}">
                    <h2 class="sr-only"><f:translate key="plugin_results" extensionName="solr" /></h2>
                    <div class="d-solr-results-toolbar">
                        <f:if condition="{pagination.lastPageNumber} > 1">
                            <f:render partial="Result/Pagination" section="Pagination" arguments="{resultSet: resultSet, pagination: pagination, currentPage: currentPage}"/>
                        </f:if>
                        <f:render partial="Result/PerPage" section="PerPage" arguments="{resultSet: resultSet}" />
                    </div>

                    <div data-start="{pagination.startRecordNumber}" class="d-solr-results-list">
                        <f:for each="{resultSet.searchResults}" as="document">
                            <f:render partial="Result/Document" section="Document" arguments="{resultSet: resultSet, document: document}" />
                        </f:for>
                    </div>

                    <f:if condition="{pagination.lastPageNumber} > 1">
                        <f:render partial="Result/Pagination" section="Pagination" arguments="{resultSet: resultSet, pagination: pagination, currentPage: currentPage}"/>
                    </f:if>
                </f:else>
            </f:if>
        </f:if>
    </div>
</f:section>

<f:section name="extra">
    <div id="tx-solr-search-functions" class="space-y-6">
        <f:if condition="{resultSet.hasSearched} && {resultSet.usedSearchRequest.contextTypoScriptConfiguration.searchFaceting}">
            <f:render partial="Result/Facets" section="Facets" arguments="{resultSet: resultSet}" />
        </f:if>

        <f:if condition="{resultSet.usedSearchRequest.contextTypoScriptConfiguration.searchFrequentSearches}">
            <f:render partial="Search/FrequentlySearched" section="FrequentlySearched" arguments="{resultSet: resultSet}" />
        </f:if>

        <f:if condition="{resultSet.usedSearchRequest.contextTypoScriptConfiguration.searchLastSearches}">
            <f:render partial="Search/LastSearches" section="LastSearches" arguments="{resultSet: resultSet}" />
        </f:if>
    </div>
</f:section>

</html>
