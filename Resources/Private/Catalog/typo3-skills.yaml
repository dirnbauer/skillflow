# Skill catalogue of github.com/dirnbauer/typo3-skills for Skillflow's skill
# search: topics (groups), showcase skills, audiences, publishers, test
# coverage and install commands. Matched to skills by `repository`.
#
# Editorial, edited by hand: groups, and per skill group, superfeature and
# audience. Facts, rewritten by
#   php Build/Scripts/refresh-skill-catalog.php <this file> <checkout>
# owner, origin, upstream, license, evals, updated.
# Labels are LLL references (Resources/Private/Language/catalog.xlf).
# Format: Documentation/Search/Catalogue.rst

repository: 'https://github.com/dirnbauer/typo3-skills'
title: 'TYPO3 agent skills'
license: 'MIT AND CC-BY-SA-4.0'
install:
  all: 'git clone https://github.com/dirnbauer/typo3-skills.git && cd typo3-skills && ./install.sh'
  skill: 'git clone https://github.com/dirnbauer/typo3-skills.git ~/typo3-skills; mkdir -p {dir} && ln -s ~/typo3-skills/skills/{skill} {dir}/{skill}'
  pack: 'git clone https://github.com/dirnbauer/typo3-skills.git ~/typo3-skills; mkdir -p {dir} && for s in {skills}; do ln -s ~/typo3-skills/skills/$s {dir}/$s; done'
clients:
  -
    key: claude
    label: 'Claude Code'
    directory: ~/.claude/skills
    call: '/{skill}'
  -
    key: codex
    label: Codex
    directory: ~/.codex/skills
    call: '${skill}'
  -
    key: cursor
    label: Cursor
    directory: ~/.cursor/skills
    call: '/{skill}'
  -
    key: gemini
    label: 'Gemini CLI'
    directory: ~/.gemini/skills
    call: ''
  -
    key: windsurf
    label: Windsurf
    directory: ~/.codeium/windsurf/skills
    call: '@{skill}'
audiences:
  site: 'LLL:EXT:skillflow/Resources/Private/Language/catalog.xlf:audience.site'
  extension: 'LLL:EXT:skillflow/Resources/Private/Language/catalog.xlf:audience.extension'
  core: 'LLL:EXT:skillflow/Resources/Private/Language/catalog.xlf:audience.core'
