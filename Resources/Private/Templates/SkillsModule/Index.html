<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Module"/>

<f:section name="Content">
<f:variable name="ll">LLL:EXT:skillflow/Resources/Private/Language/locallang.xlf:</f:variable>
<div class="skf-module">
    <f:if condition="{executionBlockReason}">
        <div class="callout callout-warning"><div class="callout-content">
            <h4 class="callout-title"><f:translate key="{ll}security.blocked.title"/></h4>
            <p class="mb-0">{executionBlockReason}</p>
        </div></div>
    </f:if>
    <div class="callout callout-info"><div class="callout-content">
        <h4 class="callout-title"><f:translate key="{ll}skills.headline"/></h4>
        <p><f:translate key="{ll}skills.managed"/></p>
        <f:if condition="{nrLlmSkillsUri}"><a href="{nrLlmSkillsUri}" class="btn btn-default"><f:translate key="{ll}skills.manage"/></a></f:if>
    </div></div>

    <div class="card skf-card skf-run">
        <div class="card-header"><h2 class="skf-card-title"><core:icon identifier="actions-play" size="small"/> <f:translate key="{ll}run.headline"/></h2></div>
        <div class="card-body">
            <p class="skf-muted"><f:translate key="{ll}run.workspace"/>: <strong>{currentWorkspace}</strong></p>
            <f:if condition="{hasCurrentPage}">
                <div class="skf-target">
                    <core:icon identifier="apps-pagetree-page-default" size="small"/>
                    <span class="skf-target__title">{currentPageTitle}</span>
                    <span class="badge badge-info"><f:translate key="{ll}common.id"/> {currentPageUid}</span>
                </div>
            </f:if>

            <f:if condition="{skills} && !{executionBlockReason}">
                <f:then>
                    <form action="{moduleUri}" method="post">
                        <div class="skf-run-grid">
                            <div class="skf-field skf-field--page">
                                <label class="form-label" for="skillflow-page"><f:translate key="{ll}run.page"/></label>
                                <input id="skillflow-page" type="number" min="1" name="page" value="{currentPageUid}" class="form-control" required="required"/>
                            </div>
                            <div class="skf-field skf-field--skill">
                                <label class="form-label" for="skillflow-skill"><f:translate key="{ll}run.skill"/></label>
                                <select id="skillflow-skill" name="skill" class="form-select">
                                    <f:for each="{skills}" as="skill"><option value="{skill.uid}">{skill.name}</option></f:for>
                                </select>
                            </div>
                            <f:if condition="{engines}">
                                <div class="skf-field skf-field--engine">
                                    <label class="form-label" for="skillflow-engine"><f:translate key="{ll}run.engine"/></label>
                                    <select id="skillflow-engine" name="engine" class="form-select">
                                        <option value=""><f:translate key="{ll}run.engine.auto"/></option>
                                        <option value="classic"><f:translate key="{ll}run.engine.classic"/></option>
                                        <f:for each="{engines}" as="engine"><option value="{engine}">{engine}</option></f:for>
                                    </select>
                                </div>
                            </f:if>
                            <div class="skf-actions">
                                <button type="submit" name="action" value="run" class="btn btn-primary">
                                    <core:icon identifier="actions-play" size="small"/> <f:translate key="{ll}run.submitSelected"/>
                                </button>
                                <button type="submit" name="action" value="runPageSkills" class="btn btn-default">
                                    <f:translate key="{ll}run.submitAssigned"/> ({assignedSkillsCount})
                                </button>
                            </div>
                        </div>
                        <div class="skf-field skf-field--instructions">
                            <label class="form-label" for="skillflow-instructions"><f:translate key="{ll}run.instructions"/></label>
                            <textarea id="skillflow-instructions" name="instructions" class="form-control" rows="3"></textarea>
                        </div>
                    </form>
                </f:then>
                <f:else>
                    <f:if condition="!{skills}">
                        <div class="callout callout-warning"><div class="callout-content">
                            <h4 class="callout-title"><f:translate key="{ll}skills.empty.title"/></h4>
                            <p class="mb-0"><f:translate key="{ll}skills.empty"/></p>
                        </div></div>
                    </f:if>
                </f:else>
            </f:if>
        </div>
    </div>

    <div class="card skf-card">
        <div class="card-header"><h2 class="skf-card-title"><f:translate key="{ll}runs.headline"/></h2></div>
        <div class="table-fit"><table class="table table-striped table-hover">
            <thead><tr>
                <th><f:translate key="{ll}runs.col.date"/></th>
                <th><f:translate key="{ll}runs.col.skill"/></th>
                <th><f:translate key="{ll}runs.col.target"/></th>
                <th><f:translate key="{ll}runs.col.status"/></th>
                <th><f:translate key="{ll}run.runner"/></th>
                <th><f:translate key="{ll}runDetail.report"/></th>
            </tr></thead>
            <tbody>
            <f:for each="{runs}" as="run"><tr>
                <td>{run.createdFormatted}</td><td>{run.skillTitle}</td><td>{run.target_table}:{run.target_uid}</td>
                <td><span class="badge badge-info">{run.status}</span></td><td>{run.runner}</td>
                <td><a class="btn btn-default btn-sm" href="{run.showUri}"><f:translate key="{ll}runs.show"/></a></td>
            </tr></f:for>
            <f:if condition="!{runs}"><tr><td colspan="6"><f:translate key="{ll}runs.empty"/></td></tr></f:if>
            </tbody>
        </table></div>
    </div>
</div>
</f:section>
</html>
