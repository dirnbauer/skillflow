services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Everything under Classes/ is a service. CLI commands (skillflow:run,
  # skillflow:solr:index, skillflow:skills:sync|enable|list) register through
  # #[AsCommand], the backend module controller through #[AsController].
  Webconsulting\Skillflow\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Configuration/*'
      - '../Classes/Domain/*'
      - '../Classes/Event/*'
      - '../Classes/Exception/*'
      - '../Classes/Support/*'

  # The extension configuration, read once per container.
  Webconsulting\Skillflow\Configuration\ExtensionSettings:
    factory: ['Webconsulting\Skillflow\Configuration\ExtensionSettings', 'load']
    arguments:
      - '@TYPO3\CMS\Core\Configuration\ExtensionConfiguration'

  # The abilities contract of skills (optional typo3-abilities). Public for
  # other extensions that run skills through their own engines.
  Webconsulting\Skillflow\Service\SkillAbilityResolver:
    public: true

  # Instantiated via GeneralUtility::makeInstance() by the DataHandler hook registry
  Webconsulting\Skillflow\Hooks\DataHandlerHook:
    public: true
