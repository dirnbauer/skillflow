services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Everything under Classes/ is a service. CLI commands (skillflow:run,
  # skillflow:solr:index, skillflow:skills:sync|enable|list) live in
  # Classes/Command and are registered through their #[AsCommand] attribute:
  # autoconfiguration adds the console.command tag and makes them public.
  Webconsulting\Skillflow\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/*'
      - '../Classes/Event/*'
      - '../Classes/Exception/*'
      - '../Classes/Support/*'

  # Instantiated via GeneralUtility::makeInstance() by the DataHandler hook registry
  Webconsulting\Skillflow\Hooks\DataHandlerHook:
    public: true

  # Backend module route target
  Webconsulting\Skillflow\Controller\SkillsModuleController:
    public: true
