name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: Build/Scripts/runTests.sh -s unit -p ${{ matrix.php }}
      - run: Build/Scripts/runTests.sh -s functional -p ${{ matrix.php }}
      - run: composer analyse
      - run: composer lint
      - run: composer rector
      - run: composer fractor
      - run: composer audit
